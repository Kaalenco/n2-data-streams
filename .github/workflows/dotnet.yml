# Build and test on every push/PR to trunk.
# Publishing to nuget.org only happens for version tags (v*), after build and test succeed.

name: .NET Build and test

on:
  push:
    branches: [ "trunk" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "trunk" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 and 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Restore dependencies
      run: dotnet restore src

    - name: Build
      run: dotnet build src --no-restore -c Release

    - name: Test
      run: dotnet test src --no-build -c Release --verbosity normal

    - name: Pack
      if: github.ref_type == 'tag'
      run: dotnet pack src/N2.DataStreams/N2.DataStreams.csproj --no-build -c Release -o artifacts

    - name: Upload package
      if: github.ref_type == 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: artifacts/*.nupkg
        if-no-files-found: error

  publish:
    # Only for version tags, and only when build and tests passed.
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nuget-package
        path: artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish to nuget.org
      env:
        NUGET_API_KEY: ${{ secrets.PACKAGE_N2 }}
      run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
