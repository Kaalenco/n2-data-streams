# Build and test on every push/PR to trunk.
# Pushes to trunk publish to the private vault-packages feed. nuget.org is promoted from that
# feed by the n2-publishing repository; this workflow never pushes to nuget.org.

name: .NET Build and test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET 10.0 and 11.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    # The vault-packages feed (see src/nuget.config) needs a credential. NUGET_PAT is a Packaging
    # (read & write) PAT stored as a repository secret. It is added to the runner's copy of
    # src/nuget.config only; it is never committed or echoed.
    - name: Authenticate to vault-packages
      env:
        NUGET_PAT: ${{ secrets.NUGET_PAT }}
      run: |
        if [ -z "$NUGET_PAT" ]; then
          echo "::error::Repository secret NUGET_PAT is not set; cannot use vault-packages."
          exit 1
        fi
        dotnet nuget update source vault-packages --username az --password "$NUGET_PAT" --store-password-in-clear-text --configfile src/nuget.config
    - name: Restore dependencies
      run: dotnet restore src
    # GeneratePackageOnBuild=True makes the Release build produce the .nupkg as well.
    - name: Build
      run: dotnet build src --no-restore --configuration Release
    - name: Test
      run: dotnet test src --no-build --configuration Release --verbosity normal
    # Publish to vault-packages on pushes to trunk only (not on pull requests). An existing version
    # is skipped, so only a version bump publishes a new package.
    - name: Publish to vault-packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
      working-directory: src
      run: |
        set -euo pipefail
        shopt -s nullglob
        packages=(N2.DataStreams/bin/Release/*.nupkg)
        if [ ${#packages[@]} -eq 0 ]; then
          echo "::error::No *.nupkg found in N2.DataStreams/bin/Release; nothing to publish."
          exit 1
        fi
        for pkg in "${packages[@]}"; do
          dotnet nuget push "$pkg" --source vault-packages --api-key az --skip-duplicate
        done
